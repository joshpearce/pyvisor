[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pyvisor"
version = "0.1.0"
description = "Durable sandbox service for AI-agent Python workspaces"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Pyvisor contributors" }]
dependencies = [
    "fastapi==0.115.12",
    "pydantic==2.10.6",
    "uvicorn==0.34.0",
]

[project.scripts]
pyvisor = "pyvisor.app:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "ruff==0.9.10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "runsc_integration: requires an explicitly enabled, delegated NixOS runsc environment",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyvisor"]
